[project]
name = "ticknet-signal-acceptance"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["quant-deep-learning", "quant-platform", "research-contracts", "pytest>=8,<10", "torch>=2", "pandas>=2,<3", "numpy>=1.24,<2.4"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
quant-deep-learning = { path = "../..", editable = true }
quant-platform = { git = "https://github.com/runchengxie/quant-platform.git", rev = "282afca4c4ca210d46eed096a943972662fede99" }
research-contracts = { git = "https://github.com/runchengxie/quant-platform.git", rev = "282afca4c4ca210d46eed096a943972662fede99", subdirectory = "packages/research-contracts" }

[tool.pytest.ini_options]
testpaths = ["."]
filterwarnings = ["error"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
