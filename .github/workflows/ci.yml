name: Pull request quality

on:
  push:
    branches: [main]
    paths:
      - "integration/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "configs/**"
      - "web/**"
      - "README.md"
      - "AGENTS.md"
      - "mkdocs.yml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "integration/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "configs/**"
      - "web/**"
      - "README.md"
      - "AGENTS.md"
      - "mkdocs.yml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-deep-learning-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository history for changed-file checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          python-version: "3.12"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Check changed-file hygiene
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BEFORE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z "$base" "$GITHUB_SHA")
          if [ "${#files[@]}" -gt 0 ]; then
            uv run --locked --extra dev python scripts/ci_hygiene.py "${files[@]}"
          fi

      - name: Run Ruff
        run: |
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev ruff format --check .

      - name: Lint notebook code
        run: uv run --locked --extra dev nbqa ruff --extend-ignore=E402,B018 .

      - name: Run ty
        run: uv run --locked --extra dev ty check

      - name: Run shared code-quality metrics
        run: uv run --locked --extra dev research-code-quality --root . --scope src --scope scripts --scope tests --baseline docs/.code-quality-baseline.json --ratchet --json

      - name: Run tests with coverage and strict warnings
        run: uv run --locked --extra dev pytest --cov --cov-report=term-missing -W error

      - name: Run synthetic model smoke checks
        run: uv run python scripts/smoke_test.py

      - name: Compile public Python sources
        run: python -m compileall -q src scripts

  signal-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          python-version: "3.12"
      - name: Check out pinned runtime provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: runchengxie/quant-backtest-runtime
          ref: c9493008ad41da4391db38542528a4ccbe385b73
          path: .runtime-provider
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: .runtime-provider/go.sum
      - name: Build pinned Go queue executable
        working-directory: .runtime-provider
        run: go build -trimpath -mod=readonly -ldflags "-X github.com/runchengxie/quant-backtest-runtime/internal/app.SourceRevision=c9493008ad41da4391db38542528a4ccbe385b73" -o "$RUNNER_TEMP/backtest-job" ./cmd/backtest-job
      - name: Accept synthetic signals with installed platform and real Go worker
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/signal-acceptance
          BACKTEST_GO_EXECUTABLE: ${{ runner.temp }}/backtest-job
        run: uv run --project integration/signal-acceptance --locked pytest -c integration/signal-acceptance/pyproject.toml integration/signal-acceptance -q
